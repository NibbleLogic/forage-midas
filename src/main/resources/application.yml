general:
  kafka-topic: "midas-transactions"
  incentive-api-url: "http://localhost:33433/incentive"

server:
  port: 33400

spring:
  datasource:
    url: "jdbc:h2:mem:midas;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    driver-class-name: "org.h2.Driver"
    username: "sa"
    password: ""
  jpa:
    hibernate:
      ddl-auto: "create-drop"
    properties:
      hibernate:
        format_sql: true
  kafka:
    consumer:
      group-id: "midas-core-group"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"
        spring.json.value.default.type: "com.jpmc.midascore.foundation.Transaction"  # ADD THIS
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer